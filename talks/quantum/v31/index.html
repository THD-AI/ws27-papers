<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quantum v3.1 player</title>
<style>
:root{--paper:#FBFBFC;--ink:#15171C;--muted:#5C6370;--context:#BBBEC4;--hair:#DADDE3;--qc-red:#C8321F}
html,body{margin:0;background:var(--paper)}
svg{display:block;width:1920px;height:1080px;background:var(--paper)}
path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
[data-stroke=grid]{stroke:var(--hair);stroke-width:1.5}
[data-stroke=object]{stroke:var(--ink);stroke-width:3}
.zone.context [data-stroke=object]{stroke:var(--context)}
[data-stroke=route]{stroke:var(--ink);stroke-width:4}
[data-stroke=route].red{stroke:var(--qc-red)}
[data-stroke=leader]{stroke:var(--ink);stroke-width:2}
#ann text{font:500 32px 'Libre Franklin',sans-serif;fill:var(--ink)}
</style></head><body>
<svg id="page" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><g id="cam"></g><g id="ann"></g></svg>
<script type="module">
// Bare v3.1 player for block 2: ?page=N (1-based), ?route=chevron|strip, ?print=1.
import { makeRoute, buildWorld } from './world.js';
import { rect, project } from './camera.js';
const q = new URLSearchParams(location.search);
const P = await (await fetch('./pages.json')).json();
const n = Math.max(0, Math.min(P.pages.length - 1, (+q.get('page') || 1) - 1));
const page = P.pages[n], route = makeRoute(q.get('route') || 'chevron');
const r = rect(P.stops[page.camera], route, P.map);
const cam = document.getElementById('cam');
const world = buildWorld(cam, route, P.zones, P.map, { overview: page.camera === 'overview' });
cam.setAttribute('transform', `scale(${1920 / r.w}) translate(${-r.x},${-r.y})`);
for (const z of world.querySelectorAll('.zone')) if (page.focus && z.dataset.zone !== page.focus) z.classList.add('context');
// annotations in screen px, placed by camera maths (getScreenCTM only measures)
const ann = document.getElementById('ann'), NS = 'http://www.w3.org/2000/svg';
for (const z of P.zones) {
  const [x, y] = project(route.at((z.from + z.to) / 2), r);
  if (x < 0 || x > 1920 || y < 0 || y > 1080) continue;
  const l = document.createElementNS(NS, 'path'); l.setAttribute('d', `M${x},${y}L${x + 60},${y - 120}`); l.setAttribute('data-stroke', 'leader'); ann.append(l);
  const t = document.createElementNS(NS, 'text'); t.setAttribute('x', x + 68); t.setAttribute('y', y - 124); t.setAttribute('data-anchor', z.id); t.textContent = z.id + ' ' + z.name; ann.append(t);
}
window.V31 = { page: n + 1, camera: page.camera, rect: r, route: route.kind, ready: true };
</script></body></html>
