<!doctype html><html lang="en"><head><meta charset="utf-8"><title>v3.1 board: backups</title>
<style>body{margin:0;background:#FBFBFC;font:500 24px 'Libre Franklin',sans-serif;color:#15171C}#root{display:grid;grid-template-columns:repeat(3,640px);gap:24px;padding:24px}
.f{width:640px;height:360px;overflow:hidden;outline:1px solid #DADDE3}iframe{width:1920px;height:1080px;border:0;transform:scale(.3333);transform-origin:0 0}</style></head>
<body><div id="root"></div><script>
// Thin page over the real player: final frame of every beat, 3 x 3.
const route = new URLSearchParams(location.search).get('route') || 'chevron';
for (let i = 10; i <= 14; i++) document.getElementById('root').insertAdjacentHTML('beforeend', `<div><div class="f"><iframe src="../index.html?print=1&page=${i}&route=${route}"></iframe></div>page ${i}, backup b${i - 9}</div>`);
</script></body></html>
