<!doctype html><html lang="en"><head><meta charset="utf-8"><title>v3.1 board: kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500&display=swap">
<link rel="stylesheet" href="../player.css">
<style>body{margin:0;background:#FBFBFC;font:500 24px 'Libre Franklin',sans-serif;color:#15171C}#root{padding:24px}
h2{font:500 28px 'Libre Franklin',sans-serif;margin:8px 0 12px}.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:24px;align-items:flex-end}.row>div{text-align:center}
svg.tile{display:block;background:#FBFBFC;outline:1px solid #DADDE3}
svg.tile path{stroke:#15171C;fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}</style></head>
<body><div id="root"></div><script type="module">
// Every world object of the v3.1 kit, at the reading zoom (beat 1, 0.8 px per map unit)
// and as its overview variant (beat 0, 0.2 px per unit), with names. Pile count from facts.json.
import * as K from '../objects.js';
import { CRYO } from '../world.js';
const F = await (await fetch('../facts.json')).json();
const fact = (id) => F.facts.find((f) => f.id === id).value;
const NS = 'http://www.w3.org/2000/svg', C = Math.cos(Math.PI / 6);
const pileN = Math.round(fact('waiting-62-at-66') / 2);
const rowPrisms = (hs, step = 190) => { const out = []; hs.forEach((h, i) => out.push(...K.prism([i * step, 0], h, 90, 'k' + i))); out.push(...K.backPlaneX([-100, 45], hs.length * step + 60, Math.max(...hs) + 60, hs.length === 2 ? 50 : 100, Math.max(...hs), 'kp')); return out; };
const OBJ = [
  ['cryostat (forged, raster)', { image: true }, { paths: K.cryoOverview(), k: CRYO.h / CRYO.H }],
  ['chip (sample holder, SMP)', K.chip([0, 0]), K.chipOverview([0, 0])],
  ['film strip', K.film([0, 0]), K.filmOverview([0, 0])],
  ['reader (19-inch rack)', K.reader([0, 0]), K.readerOverview([0, 0])],
  ['check tile', K.checkTile([0, 0]), K.checkTile([0, 0], 180)],
  ['lifted tile, beat 4 (3 fired)', K.liftedTile([0, 0]), K.checkTile([0, 0], 420)],
  ['qubit + smear', K.qubit([0, 0]), K.qubitOverview([0, 0])],
  ['frame', K.frame([0, 0]), K.frame([0, 0])],
  [`pile, ${pileN} frames (62 / N = 2)`, K.pile([0, 0], pileN), K.pileOverview([0, 0], pileN * 14)],
  ['prisms + back plane, beat 5', rowPrisms([342, 286]), rowPrisms([342, 286]).slice(0, 20)],
  ['prisms + back plane, beat 7', rowPrisms([282, 266, 218]), rowPrisms([282, 266, 218]).slice(0, 20)],
  ['rulers, beat 8 (24 s, 1.1 s)', [...K.ruler([0, 0], [C, 0.5], 2400, 100), ...K.ruler([0, 120], [C, 0.5], 110, 0, 20)], [...K.ruler([0, 0], [C, 0.5], 2400), ...K.ruler([0, 120], [C, 0.5], 110)]],
];
const root = document.getElementById('root');
for (const [title, s, which] of [['Reading zoom (beat 1, 0.8 px per unit)', 0.8, 1], ['Overview variants (beat 0, 0.2 px per unit)', 0.2, 2]]) {
  root.insertAdjacentHTML('beforeend', `<h2>${title}</h2>`);
  const row = document.createElement('div'); row.className = 'row'; root.append(row);
  for (const o of OBJ) {
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'tile'); svg.dataset.name = o[0]; svg.dataset.row = which;
    const cell = document.createElement('div'); cell.append(svg); cell.append(Object.assign(document.createElement('div'), { textContent: o[0], style: 'max-width:340px;font-size:24px' })); row.append(cell);
    const g = document.createElementNS(NS, 'g'); svg.append(g);
    const src = o[which];
    if (src.image) { const im = document.createElementNS(NS, 'image'); const k = CRYO.h / CRYO.H; im.setAttribute('href', CRYO.src); im.setAttribute('width', CRYO.W * k); im.setAttribute('height', CRYO.h); g.append(im); }
    else { const list = src.paths || src; for (const q of list) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', q.d); p.setAttribute('stroke-width', q.w); if (src.k) p.setAttribute('transform', `scale(${src.k})`); p.dataset.stroke = 'object'; g.append(p); } }
    const bb = g.getBBox(), pad = 30 / s, w = Math.max(bb.width + 2 * pad, 300 / s), h = Math.max(bb.height + 2 * pad, 200 / s);
    svg.setAttribute('width', Math.round(w * s)); svg.setAttribute('height', Math.round(h * s));
    svg.setAttribute('viewBox', `${bb.x - (w - bb.width) / 2} ${bb.y - (h - bb.height) / 2} ${w} ${h}`);
  }
}
window.KIT = true;
</script></body></html>
