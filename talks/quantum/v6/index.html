<body>
<div class=s id=p1></div><div class=s id=p2></div><div class=s id=m1></div><div class=s id=p3></div><div class=s id=p4></div><div class=s id=p5></div><div class=s id=p6></div><div class=s id=p7></div><div class=s id=p8></div><div class=s id=p9></div><div class=s id=p10></div><div class=s id=p11></div><div class=s id=p12></div><div class=s id=p13></div><div class=s id=p14></div><div class=s id=p15></div><div class=s id=p16></div><div class=s id=p17></div><div class=s id=b1></div><div class=s id=b2></div><div class=s id=b3></div><div class=s id=b4></div><div class=s id=b5></div><div class=s id=b6></div><div class=s id=b7></div><div class=s id=b8></div><div class=s id=b9></div>
<script type=module>
// The quantum talk, v6. Every page drawn in code from the article's own
// figure code (lib/fig.js, articles/other-half/figures/shared.js) and data.
//
// The system (attention/plan-v6.md in the talk's working folder):
// - two colours, one meaning each, at full strength on the point:
//   AMBER = what the chip says (a slip, a fired check, a frame of hints),
//   BLUE  = what the reader decides (the decoder, its guess, its number);
//   everything else ink or one grey;
// - two layouts: a pair of equal halves around a gutter, or a full-width
//   sequence, left to right;
// - one code: a frame is a film frame, an error a black disc with its letter,
//   the decoder's guess a blue ring with its letter, a fired check an amber
//   outline with a dot;
// - the section: which part of the machine the page is about (the chip, the
//   hints, the reader), named beside the page number, as the Renovate talk does.
const L = new URL('../../../', location.href).href; // the repository root, served
const F = await import(L + 'lib/fig.js');
const S = await import(L + 'articles/other-half/figures/shared.js');
const J = async (n) => (await fetch(L + 'articles/other-half/data/' + n + '.json')).json();
const lat = await J('lattice'), lineD = await J('line'), film = await J('film');
const syn = await J('syndromes'), learn = await J('learning');
const { toGrid } = await import(L + 'articles/other-half/figures/film-rule.js');
for (const f of ['600 64px Newsreader', 'italic 28px Newsreader', '28px "Libre Franklin"', '500 28px "Libre Franklin"', '22px "JetBrains Mono"', '30px Excalifont']) await document.fonts.load(f);
const { circle, path, line, rect, text, penRing, cells } = F;

const INK = '#15171C', PAPER = '#FBFBFC', MUTED = '#5A606B', QUIET = '#8A909B', RULE = '#B9BEC7';
const BLUE = '#2B44C6', BLUE_T = '#DCE2FA';
const AMBER = '#B85C00', AMBER_T = '#FBE3C8';
const C = { ink: INK, paper: PAPER, muted: MUTED, hairline: RULE, accent: AMBER, field: AMBER_T };
const T = (p, x, y, s, o = {}) => text(p, x, y, s, { free: true, fill: INK, ...o });
const TW = 500, PEN = 3;
const SUB = { size: 36, family: 'sans', fill: MUTED };
const LAB = { size: 32, family: 'sans', fill: INK };
const CAP = { size: 28, family: 'sans', fill: MUTED };
const BIG = { family: 'sans', weight: 500 };
const PENCIL = { stroke: '#2E2C27', 'stroke-width': 2.6, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
const arrow = (svg, x1, y1, x2, y2, col = INK, w = 3) => {
  path(svg, `M${x1} ${y1}L${x2} ${y2}`, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' });
  const a = Math.atan2(y2 - y1, x2 - x1), k = 16;
  path(svg, `M${x2 - k * Math.cos(a - 0.45)} ${y2 - k * Math.sin(a - 0.45)}L${x2} ${y2}L${x2 - k * Math.cos(a + 0.45)} ${y2 - k * Math.sin(a + 0.45)}`, { stroke: col, 'stroke-width': w, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
};

// a grid whose fired checks read from the back
function deckGrid(svg, o) {
  const G = S.grid(svg, { C, helper: 0, ...o });
  G.root.querySelectorAll('circle').forEach((e) => { if (e.getAttribute('stroke') === INK) e.setAttribute('stroke-width', o.sw || 2.5); });
  for (const t of Object.values(G.tiles)) {
    t.field.setAttribute('stroke-width', 3);
    if (t.check.asks_about === 'flips') t.base.setAttribute('fill-opacity', '0.17');
    t.base.setAttribute('stroke-opacity', '0.9');
    const set = t.setFired.bind(t);
    t.setFired = (p) => { set(p); if (p > 0.001) t.base.setAttribute('fill-opacity', '0'); };
  }
  return G;
}
// an error: a black disc with its letter; the decoder's guess: a blue ring
const errMark = (svg, x, y, r, letter) => S.errMark(svg, x, y, r, letter, C, 'real');
function guess(svg, x, y, r, letter) {
  circle(svg, x, y, r, { fill: PAPER, stroke: BLUE, 'stroke-width': Math.max(3, r * 0.12) });
  T(svg, x, y + r * 0.5, letter, { family: 'sans', size: r * 1.42, weight: 600, anchor: 'middle', fill: BLUE });
}
// one frame of film: a cell with sprocket holes
function frame(svg, x, y, w, h, o = {}) {
  rect(svg, x, y, w, h, { fill: o.fill || PAPER, stroke: o.stroke || INK, 'stroke-width': o.sw || 2 });
  if (o.holes !== false) for (const yy of [y + Math.min(h * 0.14, 22), y + h - Math.min(h * 0.14, 22)]) circle(svg, x + w / 2, yy, Math.min(8, Math.max(2, h * 0.045)), { fill: o.stroke || INK });
  if (o.dot) circle(svg, x + w / 2, y + h / 2, Math.min(w, h) * 0.17, { fill: o.dot });
}
// the spine, as the Renovate talk draws its cable: one hairline from the
// chip's mark (left) to the reader's (right); only the page's part is lit,
// as a short bar in its colour, and named.
// where: 'chip' | 'film' | 'reader', a list of them, [] (none lit), or null (no spine)
const DIM = '#A9AEB7';
const SEG = { chip: [80, 640, INK, 'the chip'], film: [660, 1260, AMBER, 'the hints'], reader: [1280, 1840, BLUE, 'the reader'] };
function spine(svg, where) {
  const W = [].concat(where || []);
  let x = 1740;
  for (const k of W.slice().reverse()) {
    const [, , col, name] = SEG[k];
    T(svg, x, 1054, name, { family: 'sans', size: 20, weight: 600, fill: col === INK ? MUTED : col, anchor: 'end' });
    x -= name.length * 10.5 + 34;
  }
}
function slide(id, title, n, foot, where, o = {}) {
  const svg = F.h('svg', { viewBox: '0 0 1920 1080', width: 1920, height: 1080 });
  document.getElementById(id).appendChild(svg);
  if (title) T(svg, 80, 140, title, { size: 68, weight: TW, family: 'serif' });
  if (o.sub) T(svg, 80, 214, o.sub, SUB);
  if (where) spine(svg, where);
  if (foot) T(svg, 80, 1054, foot, { family: 'mono', size: 18, fill: MUTED });
  if (n) T(svg, 1840, 1054, typeof n === 'string' ? 'backup ' + n.slice(1) : n + ' / 18', { family: 'mono', size: 18, fill: MUTED, anchor: 'end' });
  return svg;
}
// A build: the page drawn k times, one more part each click, as the Renovate
// talk does. Frames 1..k-1 are '<id>-1'..; the last, complete one keeps the id.
function build(id, k, fn) {
  const base = document.getElementById(id);
  for (let st = 1; st < k; st++) {
    const d = document.createElement('div'); d.className = 's'; d.id = `${id}-${st}`;
    base.parentNode.insertBefore(d, base);
    fn(d.id, st);
  }
  fn(id, k);
}
function hbar(svg, x, y, w, h, o) { rect(svg, x, y, Math.max(2, w), h, { rx: 4, ...o }); }

// ---------------- 1: the title, the device and the question
{
  const svg = slide('p1', null, null, null, null);
  F.h('image', { href: 'heap.png', x: 520, y: 250, width: 1440, height: 810 }, svg);
  T(svg, 80, 250, 'The other half', { size: 112, weight: TW, family: 'serif' });
  T(svg, 80, 370, 'of a quantum', { size: 112, weight: TW, family: 'serif' });
  T(svg, 80, 490, 'computer', { size: 112, weight: TW, family: 'serif' });
  T(svg, 82, 600, 'Can the ordinary half', { size: 44, family: 'sans', weight: 500, fill: BLUE });
  T(svg, 82, 656, 'keep up with the chip?', { size: 44, family: 'sans', weight: 500, fill: BLUE });
  T(svg, 82, 760, 'Quantum Computing seminar', { size: 30, family: 'sans', fill: MUTED });
  T(svg, 82, 802, 'TH Deggendorf · 9 January 2027', { size: 30, family: 'sans', fill: MUTED });
}

// ---------------- 2: the headline, and what was underneath (pair)
{
  const svg = slide('p2', 'Willow’s real news wasn’t the speed', 2,
    'speed: Google blog, 9 Dec 2024 · errors: Nature 638 (2025), Table S1', null);
  // left: the headline, quiet
  T(svg, 80, 300, 'the headline', { ...CAP, size: 30 });
  T(svg, 80, 420, '< 5 minutes', { ...BIG, size: 96, fill: QUIET });
  T(svg, 80, 476, 'against 10 septillion years', { ...CAP, size: 30 });
  T(svg, 80, 516, 'on a supercomputer, for a', { ...CAP, size: 30 });
  T(svg, 80, 556, 'benchmark with no known use', { ...CAP, size: 30 });
  line(svg, 900, 280, 900, 880, { stroke: RULE, 'stroke-width': 2 });
  // right: the errors, halving with each bigger grid
  T(svg, 1000, 300, 'underneath: each bigger grid halved the errors', { ...LAB, size: 32, weight: 500 });
  const base = 820, k = 0.56, xs = [1090, 1380, 1670], bw = 170;
  [[17, 712], [49, 349], [97, 171]].forEach(([q, e], i) => {
    const h = e * k;
    rect(svg, xs[i] - bw / 2, base - h, bw, h, { fill: '#D3D7DE', stroke: INK, 'stroke-width': 2.5 });
    T(svg, xs[i], base - h - 22, String(e), { ...BIG, size: 56, anchor: 'middle' });
    T(svg, xs[i], base + 44, `${q} qubits`, { ...LAB, anchor: 'middle' });
  });
  T(svg, 1000, 920, 'errors per 100,000 rounds', CAP);
  for (const i of [0, 1]) T(svg, (xs[i] + xs[i + 1]) / 2, base - 30, '÷ 2', { ...BIG, size: 40, anchor: 'middle', fill: MUTED });
}

// ---------------- 3: the map: the spine drawn large (sequence; builds chip, hints, reader, fix)
build('m1', 4, (pid, st) => {
  const svg = slide(pid, 'A quantum computer is two machines', 3, '', null,
    { sub: 'Every round, the chip sends a frame of hints; an ordinary computer reads it.' });
  const cy = 520;
  const G = deckGrid(svg, { checks: lat.checks, d: 3, cx: 300, cy, pitch: 110, qr: 18 });
  for (const id of lat.walk[0].fired) G.tiles[id].setFired(1);
  errMark(svg, ...G.pos(4), 22, 'X');
  T(svg, 300, 760, 'the chip', { ...LAB, size: 40, weight: 500, anchor: 'middle' });
  T(svg, 300, 806, 'qubits, and checks between them', { ...CAP, anchor: 'middle' });
  if (st >= 2) {
    arrow(svg, 500, cy, 580, cy);
    for (let i = 0; i < 6; i++) { const lit = i === 0 || i === 3; frame(svg, 600 + i * 92, cy - 70, 80, 140, { sw: 3, stroke: lit ? AMBER : INK, fill: lit ? AMBER_T : PAPER, dot: lit ? AMBER : null }); }
    T(svg, 600 + 3 * 92 - 6, 760, 'the hints', { ...LAB, size: 40, weight: 500, anchor: 'middle', fill: AMBER });
    T(svg, 600 + 3 * 92 - 6, 806, 'one frame every round', { ...CAP, anchor: 'middle' });
  }
  if (st >= 3) {
    arrow(svg, 1160, cy, 1240, cy);
    rect(svg, 1260, cy - 110, 330, 220, { rx: 14, fill: BLUE_T, stroke: BLUE, 'stroke-width': 4 });
    for (let i = 0; i < 6; i++) circle(svg, 1360 + i * 26, cy + 70, 6, { fill: BLUE });
    T(svg, 1425, cy - 8, 'decoder', { size: 44, family: 'sans', weight: 600, anchor: 'middle', fill: BLUE });
    T(svg, 1425, 760, 'the reader', { ...LAB, size: 40, weight: 500, anchor: 'middle', fill: BLUE });
    T(svg, 1425, 806, 'an ordinary computer', { ...CAP, anchor: 'middle' });
  }
  if (st >= 4) {
    arrow(svg, 1610, cy, 1690, cy, BLUE);
    guess(svg, 1760, cy, 40, 'X');
    T(svg, 1760, 760, 'the fix', { ...LAB, size: 40, weight: 500, anchor: 'middle', fill: BLUE });
    path(svg, 'M150 862V880H1120V862', { stroke: QUIET, 'stroke-width': 2.5, fill: 'none' });
    T(svg, 635, 920, 'quantum', { ...CAP, anchor: 'middle' });
    path(svg, 'M1250 862V880H1840V862', { stroke: BLUE, 'stroke-width': 3.5, fill: 'none' });
    T(svg, 1545, 920, 'ordinary: this talk', { ...CAP, anchor: 'middle', fill: BLUE });
  }
});

// ---------------- 4: the same recordings, two readers (pair; builds matching, then the network)
build('p3', 2, (pid, st) => {
  const svg = slide(pid, 'Same recordings, a second reader', 4, 'Nature 638 (2025) · network: Bausch et al., Nature 635 (2024)', 'reader');
  const y0 = 250, fh = 70;
  for (let i = 0; i < 23; i++) { const fw = (1440 + 6) / 23 - 6, x = 240 + i * (fw + 6), lit = (i * 5) % 3 === 0; frame(svg, x, y0, fw, fh, lit ? { dot: AMBER, sw: 2, stroke: AMBER, fill: AMBER_T } : { sw: 2 }); }
  T(svg, 960, y0 - 22, 'the same recordings from Willow’s largest grid (97 qubits), read afterwards', { ...CAP, size: 30, anchor: 'middle' });
  const col = (cx, name, sub, nn, strong) => {
    arrow(svg, cx, y0 + fh + 12, cx, y0 + fh + 52);
    rect(svg, cx - 300, 380, 600, 110, { rx: 10, fill: strong ? BLUE_T : PAPER, stroke: BLUE, 'stroke-width': strong ? 4 : 2.5 });
    T(svg, cx, 446, name, { size: 40, family: 'sans', weight: 500, anchor: 'middle', fill: BLUE });
    T(svg, cx, 530, sub, { ...CAP, size: 30, anchor: 'middle' });
    T(svg, cx, 740, String(nn), { ...BIG, size: 150, anchor: 'middle', fill: strong ? BLUE : (st === 1 ? INK : QUIET) });
    if (strong) penRing(svg, cx, 688, 190, 95, { stroke: BLUE, width: PEN + 1, seed: 11, start: 0.6 });
  };
  col(540, 'matching', 'Google’s best rule-based decoder', 171, false);
  if (st >= 2) col(1380, 'a neural network', 'trained, AlphaQubit’s design', 143, true);
  line(svg, 960, 380, 960, 800, { stroke: RULE, 'stroke-width': 2 });
  T(svg, 960, 880, 'errors per 100,000 rounds · lower is better', { ...LAB, size: 32, anchor: 'middle' });
});

// ---------------- 5: a few slips in a thousand (sequence)
{
  const svg = slide('p4', 'Even good hardware slips a few times in a thousand', 5,
    'Nature 638 (2025), Table S4, 72-qubit chip · Gidney and Ekerå (2021)', 'chip',
    { sub: 'Google’s 72-qubit chip: a two-qubit gate slips about 3 times in 1,000.' });
  const px = 18, x0 = 80, y0 = 320, cols = 40, slips = new Set([137, 512, 838]);
  for (let i = 0; i < 1000; i++) {
    const x = x0 + (i % cols) * px, y = y0 + Math.floor(i / cols) * px, on = slips.has(i);
    rect(svg, x, y, px - 3, px - 3, { fill: on ? AMBER : '#D3D7DE' });
  }
  for (const i of slips) { const x = x0 + (i % cols) * px + 6, y = y0 + Math.floor(i / cols) * px + 6; circle(svg, x + 1, y + 1, 21, { fill: 'none', stroke: AMBER, 'stroke-width': 4 }); }
  T(svg, x0, y0 + 25 * px + 56, '1,000 operations: 3 slips', { ...LAB, size: 36, weight: 500 });
  arrow(svg, 840, 540, 940, 540);
  T(svg, 980, 470, 'Breaking RSA-2048 encryption:', { ...LAB, size: 36 });
  T(svg, 980, 556, '2–3 billion costly steps', { ...LAB, size: 52, weight: 500 });
  T(svg, 980, 740, 'millions', { ...LAB, size: 64, weight: 600, fill: AMBER });
  T(svg, 980, 792, 'of slips, at the very least.', { ...LAB, size: 36, weight: 500 });
}

// ---------------- 6: measuring, so the chip asks "same or different?" (pair)
{
  const svg = slide('p5', 'Measuring a qubit destroys its superposition', 6, '', 'chip');
  // measure one qubit, the mix is gone; so the chip only compares
  const my = 500;
  circle(svg, 740, my, 110, { fill: PAPER, stroke: INK, 'stroke-width': 4 });
  T(svg, 740, my - 6, '0 and 1', { size: 44, family: 'sans', anchor: 'middle' });
  T(svg, 740, my + 44, 'at once', { ...CAP, anchor: 'middle' });
  arrow(svg, 880, my, 1040, my);
  T(svg, 960, my - 30, 'measure', { ...CAP, anchor: 'middle' });
  circle(svg, 1180, my, 110, { fill: PAPER, stroke: INK, 'stroke-width': 4 });
  T(svg, 1180, my + 32, '1', { ...BIG, size: 96, anchor: 'middle' });
  T(svg, 960, 740, 'Measure it: the mix is gone.', { ...LAB, size: 38, weight: 500, anchor: 'middle' });
  T(svg, 960, 810, 'So the chip asks a check: same, or different?', { ...LAB, size: 38, weight: 500, anchor: 'middle', fill: AMBER });
}

// ---------------- 7: two ways to go wrong (pair of cards)
{
  const svg = slide('p6', 'Two ways to go wrong: a flip, and a phase error', 7, '', 'chip',
    { sub: 'A qubit holds some 0, some 1, and a sign between them.' });
  const F2 = { family: 'serif', size: 64, italic: true, fill: INK };
  line(svg, 960, 280, 960, 880, { stroke: RULE, 'stroke-width': 2 });
  const card = (x, letter, name, before, after, checks) => {
    errMark(svg, x + 90, 370, 44, letter);
    T(svg, x + 160, 386, name, { ...LAB, size: 40, weight: 500 });
    T(svg, x + 50, 606, before, F2);
    arrow(svg, x + 340, 586, x + 410, 586);
    T(svg, x + 440, 606, after, F2);
    T(svg, x + 50, 770, checks, { ...LAB, size: 32 });
  };
  card(80, 'X', 'a flip: 0 and 1 swap', 'a·0 + b·1', 'a·1 + b·0', 'the flip checks see it');
  card(1020, 'Z', 'a phase error: the sign flips', 'a·0 + b·1', 'a·0 − b·1', 'the phase checks see it');
}

// ---------------- 8: bigger grids help, once qubits are good enough (sequence)
{
  const svg = slide('p7', 'Bigger grids help, once qubits are good enough', 8, 'Nature 638 (2025) · threshold: Fowler et al. (2012)', 'chip',
    { sub: 'Under a threshold (about 1 slip in 100 per operation), bigger grids make fewer errors; above it, more.' });
  const pitch = 54, base = 650;
  [[3, 17, 712, 330], [5, 49, 349, 960], [7, 97, 171, 1590]].forEach(([d, q, err, cx], k) => {
    const half = (d - 1) / 2 * pitch;
    deckGrid(svg, { checks: S.surface(d), d, cx, cy: base - half, pitch, qr: 13 });
    T(svg, cx, base + 64, `distance ${d}: ${q} qubits`, { ...LAB, anchor: 'middle' });
    T(svg, cx, 866, String(err), { ...BIG, size: 96, anchor: 'middle', fill: k === 2 ? INK : QUIET });
  });
  for (const [a, b] of [[330, 960], [960, 1590]]) {
    T(svg, (a + b) / 2, 792, '÷ 2', { ...BIG, size: 48, anchor: 'middle' });
    arrow(svg, a + 130, 816, b - 130, 816);
  }
  T(svg, 960, 930, 'errors per 100,000 rounds, read by matching', { ...CAP, size: 26, anchor: 'middle' });
}

// ---------------- 9: the checks see only a change (pair)
{
  const svg = slide('p8', 'The checks never see the qubits, only a change', 9, '', 'film',
    { sub: 'A check fires only in the round its answer changes.' });
  line(svg, 960, 280, 960, 880, { stroke: RULE, 'stroke-width': 2 });
  T(svg, 80, 330, 'one check, round by round', { ...LAB, weight: 500 });
  ['even', 'odd', 'odd'].forEach((w, i) => {
    const x = 80 + i * 270, fired = i === 1;
    frame(svg, x, 380, 220, 300, fired ? { fill: AMBER_T, stroke: AMBER, sw: 4 } : { sw: 3 });
    if (fired) circle(svg, x + 110, 480, 22, { fill: AMBER });
    T(svg, x + 110, 600, w, { size: 44, family: 'sans', weight: fired ? 600 : 400, anchor: 'middle', fill: fired ? AMBER : INK });
    T(svg, x + 110, 740, `round ${i + 1}`, { ...CAP, anchor: 'middle' });
  });
  T(svg, 80, 890, 'Round 2 changed, so it fires; round 3 did not.', { ...LAB, size: 32 });
  T(svg, 1000, 330, 'one flip, one round', { ...LAB, weight: 500 });
  const G = deckGrid(svg, { checks: lat.checks, d: 3, cx: 1400, cy: 590, pitch: 150, qr: 24 });
  for (const id of lat.walk[0].fired) G.tiles[id].setFired(1);
  for (const [q, letter] of Object.entries(lat.walk[0].errors)) errMark(svg, ...G.pos(+q), 30, letter);
  T(svg, 1000, 890, 'One flip: the two checks beside it fire.', { ...LAB, size: 32 });
}

// ---------------- 10: one frame of hints (drawing)
{
  const svg = slide('p9', 'Each round, the chip puts out one frame of hints', 10, '', 'film',
    { sub: 'About 90,000 rounds in a tenth of a second.' });
  F.h('image', { href: 'heap.png', x: 12, y: 170, width: 1320, height: 742 }, svg);
  const run = film.runs[0];
  const round = run.frames.findIndex((f, i) => i > 0 && f.length >= 5 && f.length <= 7 && new Set(f.map((id) => run.checks[id].kind)).size === 2);
  const pitch = 44, cx = 1600, cy = 530, bh = 4.3 * pitch;
  frame(svg, cx - bh - 30, cy - bh - 50, 2 * bh + 60, 2 * bh + 100, { sw: 4, stroke: AMBER, fill: PAPER });
  const G = deckGrid(svg, { checks: S.surface(7), d: 7, cx, cy, pitch, qr: 11 });
  const on = run.frames[round].map((id) => toGrid(run.checks[id], 7));
  Object.values(G.tiles).forEach((t) => { if (on.some((c) => c.row === t.check.row && c.col === t.check.col && c.asks_about === t.check.asks_about)) t.setFired(1); });
  path(svg, `M${cx - bh - 30} ${cy + bh + 50}L${1060} ${790}`, { stroke: AMBER, 'stroke-width': 3, 'stroke-dasharray': '8 7' });
  circle(svg, 1060, 790, 14, { fill: AMBER });
