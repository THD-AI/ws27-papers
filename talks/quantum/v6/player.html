<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The other half of a quantum computer: the talk</title>
<!-- The talk's player: the Renovate talk's player (tools/deck-offline.mjs), the
     same keys and look, plus the mouse wheel (a clicker or the Flipper's Slides
     remote scrolls) and a presenter mode in two windows.
     tools/qtalk-site.mjs pours the fonts and pages in. -->
<style>
/*__FONTS__*/
html, body { margin: 0; height: 100%; background: #111214; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#slide { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; background: #FBFBFC; transform-origin: center center; }
#slide svg { display: block; width: 1920px; height: 1080px; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 36vh; overflow: auto; background: #FBFBFC; color: #15171C;
  font: 19px/1.5 'Libre Franklin', Arial, sans-serif; padding: 14px 28px; box-shadow: 0 -1px 0 #DADDE3; }
#notes .where, #pnotes .where { color: #5C6370; font-size: 15px; }
/* in full screen the room sees the screen: the notes never show there */
body.full #notes { display: none !important; }
/* the window the room sees in presenter mode: the slide, nothing else */
body.audience #notes { display: none !important; }

/* presenter mode, this window: the page now, the next one, the time, the words */
#console { display: none; position: fixed; inset: 0; background: #111214; color: #FBFBFC; font-family: 'Libre Franklin', Arial, sans-serif;
  grid-template-columns: 1.7fr 1fr; grid-template-rows: minmax(0, 1fr) 34vh; gap: 16px; padding: 16px; box-sizing: border-box; }
body.presenter #console { display: grid; }
body.presenter #stage, body.presenter #notes { display: none !important; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #FBFBFC; overflow: hidden; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#now { display: flex; align-items: center; justify-content: center; min-height: 0; }
#now .frame { width: min(100%, calc((66vh - 32px) * 16 / 9)); }
#side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#side .k { color: #8A9099; font-size: 13px; margin-bottom: 6px; }
#next .end { aspect-ratio: 16 / 9; border: 1px dashed #3A3D44; display: grid; place-items: center; color: #8A9099; font-size: 15px; }
#time { font: 500 48px 'JetBrains Mono', monospace; line-height: 1; }
#time.late { color: #E0896B; }
#where { font: 15px 'JetBrains Mono', monospace; color: #B9BEC8; }
#side button { font: 14px 'Libre Franklin', Arial, sans-serif; color: #D5D9E0; background: #1E2026; border: 1px solid #2C2F36; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
#side button:hover { background: #2A2D34; }
#side .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#pnotes { grid-column: 1 / -1; background: #FBFBFC; color: #15171C; font: 24px/1.5 'Libre Franklin', Arial, sans-serif; padding: 16px 28px; overflow: auto; }
#pnotes em, #notes em { color: #4254C5; font-family: 'Newsreader', Georgia, serif; }

#print { display: none; }
@page { size: 13.333in 7.5in; margin: 0; }
@media print {
  html, body { background: #fff; height: auto; overflow: visible; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  #print .frame { width: 13.333in; height: 7.5in; aspect-ratio: auto; break-after: page; }
}
</style>
</head>
<body>
<div id="stage"><div id="slide"></div></div>
<aside id="notes" hidden></aside>
<section id="console">
  <div id="now"><div class="frame" id="pnow"></div></div>
  <div id="side">
    <div><div class="k">Next</div><div id="next"></div></div>
    <div><div class="k">Time, of 15:00</div><div id="time">0:00</div></div>
    <div id="where"></div>
    <div class="row"><button id="bprev">Back</button><button id="bnext">Next</button><button id="breset">Restart the clock</button><button id="bwin">Open the slide window again</button><button id="bexit">End presenter mode</button></div>
  </div>
  <div id="pnotes"></div>
</section>
<div id="print"></div>
<script>
var DATA = /*__DATA__*/null;
var PAGES = DATA.pages, SVG = DATA.svgs;
// the drawings: one blob each, shared by every page that shows them
var URLS = {};
Object.keys(DATA.images).forEach(function (k) {
  var b = atob(DATA.images[k].split(',')[1]), a = new Uint8Array(b.length);
  for (var j = 0; j < b.length; j++) a[j] = b.charCodeAt(j);
  URLS[k] = URL.createObjectURL(new Blob([a], { type: 'image/png' }));
});
function art(k) { return SVG[k].replace(/href="([a-z]+\.png)"/g, function (m, f) { return URLS[f] ? 'href="' + URLS[f] + '"' : m; }); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

var slide = document.getElementById('slide'), notes = document.getElementById('notes');
var n = Math.max(0, Math.min(PAGES.length - 1, (parseInt((location.hash || '').slice(1), 10) || 1) - 1));
var AUDIENCE = /[?&]audience\b/.test(location.search);
if (AUDIENCE) document.body.classList.add('audience', 'clean');
var win = null, chan = null, t0 = null;

function words(p) {
  var w = p.say ? esc(p.say) + (p.term ? ' <em>The field’s word: ' + esc(p.term) + '.</em>' : '')
    : (p.backup ? 'A backup: show it only for the question it answers.' : '');
  return '<div class="where">' + (p.backup ? 'Backup ' + p.id.slice(1) : 'Page ' + p.label) + (p.title ? ': ' + esc(p.title) : '') + '</div>' + w;
}
function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); slide.style.transform = 'translate(-50%, -50%) scale(' + k + ')'; }
function show(k, quiet) {
  n = Math.max(0, Math.min(PAGES.length - 1, k));
  var p = PAGES[n];
  slide.innerHTML = art(n);
  notes.innerHTML = words(p);
  if (document.body.classList.contains('presenter')) {
    consoleShow();
    if (n > 0 && t0 === null) t0 = Date.now();
  }
  history.replaceState(null, '', location.search + '#' + (n + 1));
  if (!quiet) send({ page: n });
}

// ---- presenter mode: this window shows the words, a second one the slide, in step
try { chan = new BroadcastChannel('other-half-talk'); chan.onmessage = function (e) { take(e.data); }; } catch (e) {}
function send(m) {
  m = { qtalk: m };
  try { if (chan) chan.postMessage(m); } catch (e) {}
  try { if (win && !win.closed) win.postMessage(m, '*'); } catch (e) {}
  try { if (window.opener && !window.opener.closed) window.opener.postMessage(m, '*'); } catch (e) {}
}
function take(d) {
  var m = d && d.qtalk; if (!m) return;
  if ('page' in m && m.page !== n) show(m.page, true);
  if (m.hello && !AUDIENCE) send({ page: n });
}
addEventListener('message', function (e) { take(e.data); });
function openSlides() {
  win = open(location.pathname + '?audience#' + (n + 1), 'other-half-talk-slides');
  setTimeout(function () { send({ page: n }); }, 600);
}
function presenter(on) {
  document.body.classList.toggle('presenter', on);
  if (on) { openSlides(); consoleShow(); } else fit();
}
function consoleShow() {
  var p = PAGES[n];
  document.getElementById('pnow').innerHTML = art(n);
  document.getElementById('next').innerHTML = n + 1 < PAGES.length ? '<div class="frame">' + art(n + 1) + '</div>' : '<div class="end">the end</div>';
  document.getElementById('where').textContent = p.backup ? 'backup ' + p.id.slice(1) + ' of 9' : 'page ' + p.label;
  document.getElementById('pnotes').innerHTML = words(p);
}
setInterval(function () {
  var s = t0 === null ? 0 : Math.floor((Date.now() - t0) / 1000), el = document.getElementById('time');
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  el.classList.toggle('late', s > 900);
}, 500);
document.getElementById('bprev').onclick = function () { show(n - 1); };
document.getElementById('bnext').onclick = function () { show(n + 1); };
document.getElementById('breset').onclick = function () { t0 = null; };
document.getElementById('bwin').onclick = openSlides;
document.getElementById('bexit').onclick = function () { presenter(false); };
if (AUDIENCE) send({ hello: true });

// Full screen = the Fullscreen API, the browser's own full screen (F11) or a
// window as large as the screen. In full screen the notes are hidden.
function isFull() { return !!document.fullscreenElement || matchMedia('(display-mode: fullscreen)').matches || (Math.abs(innerHeight - screen.height) < 3 && Math.abs(innerWidth - screen.width) < 3); }
function mode() { document.body.classList.toggle('full', isFull()); }
addEventListener('resize', function () { fit(); mode(); });
document.addEventListener('fullscreenchange', mode);
addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  document.body.classList.add('clean');
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].indexOf(e.key) >= 0) { e.preventDefault(); show(n + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].indexOf(e.key) >= 0) { e.preventDefault(); show(n - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(PAGES.length - 1);
  else if (e.key === 'n' || e.key === 'N') notes.hidden = !notes.hidden;
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {}); }
  else if (e.key === 'g' || e.key === 'G') {
    // a page number, as printed on the page; its first step
    var k = parseInt(prompt('Go to page (1–18)'), 10), at = -1;
    for (var j = 0; j < PAGES.length && at < 0; j++) if (PAGES[j].label === k + ' / 18') at = j;
    if (at >= 0) show(at);
  }
  else if ((e.key === 'p' || e.key === 'P') && !AUDIENCE) presenter(!document.body.classList.contains('presenter'));
});
// The wheel: one notch, one page. A clicker or the Flipper's Slides remote scrolls.
var wheelAt = 0, wheelSum = 0;
addEventListener('wheel', function (e) {
  if (e.target.closest && e.target.closest('#pnotes, #notes')) return; // the notes scroll
  e.preventDefault();
  var now = Date.now();
  if (now - wheelAt > 400) wheelSum = 0;
  wheelSum += e.deltaY;
  if (Math.abs(wheelSum) >= 30 && now - wheelAt > 250) { document.body.classList.add('clean'); show(n + (wheelSum > 0 ? 1 : -1)); wheelAt = now; wheelSum = 0; }
}, { passive: false });
slide.addEventListener('click', function () { document.body.classList.add('clean'); show(n + 1); });
addEventListener('beforeprint', function () {
  var pr = document.getElementById('print');
  // every page once, complete: a build's earlier steps are left out
  if (!pr.childElementCount) pr.innerHTML = SVG.map(function (s, k) { return /-\d+$/.test(PAGES[k].id) ? '' : '<div class="frame">' + art(k) + '</div>'; }).join('');
});
fit(); mode(); show(n, true);
</script>
</body>
</html>
