<body>
<div class=s id=p1></div><div class=s id=p2></div><div class=s id=m1></div><div class=s id=p3></div><div class=s id=p4></div><div class=s id=p5></div><div class=s id=p6></div><div class=s id=p7></div><div class=s id=p8></div><div class=s id=p9></div><div class=s id=p10></div><div class=s id=p11></div><div class=s id=p12></div><div class=s id=p13></div><div class=s id=p14></div><div class=s id=p15></div><div class=s id=p16></div><div class=s id=p17></div><div class=s id=b1></div><div class=s id=b2></div><div class=s id=b3></div><div class=s id=b4></div><div class=s id=b5></div><div class=s id=b6></div><div class=s id=b7></div><div class=s id=b8></div><div class=s id=b9></div>
<script type=module>
// Key frames for the quantum talk, built from the article's own figure code
// (ws27-papers lib/fig.js and articles/other-half/figures/shared.js) and data.
const L = new URL('../../../', location.href).href; // the repository root, served
const F = await import(L + 'lib/fig.js');
const S = await import(L + 'articles/other-half/figures/shared.js');
const J = async (n) => (await fetch(L + 'articles/other-half/data/' + n + '.json')).json();
const lat = await J('lattice'), lineD = await J('line'), film = await J('film');
const syn = await J('syndromes'), learn = await J('learning');
const { toGrid } = await import(L + 'articles/other-half/figures/film-rule.js');
for (const f of ['600 64px Newsreader', 'italic 28px Newsreader', '28px "Libre Franklin"', '22px "JetBrains Mono"', '30px Excalifont']) await document.fonts.load(f);
const C = { ink: '#15171C', paper: '#FBFBFC', muted: '#4A505B', hairline: '#DADDE3', accent: '#4254C5', field: '#C9D3F7' };
const { circle, path, line, rect, text, penRing, cells } = F;
const T = (p, x, y, s, o = {}) => text(p, x, y, s, { free: true, fill: C.ink, ...o });
const PEN = 3; // pen ring, ink only
const TW = 500; // title weight: between the article's regular and a projector's need

// One counting device for the whole deck: dots, ten to a column, filled from
// the baseline, on one scale (p2, p3, p12), so the 171 is the same object.
const DOT = { rows: 10, px: 16, r: 5.6 };
function stack(svg, x0, y, nn, fill) {
  const list = cells(nn, Math.ceil(nn / DOT.rows), { pitch: DOT.px, rows: DOT.rows, byColumn: true, up: true });
  const yb = y + DOT.rows * DOT.px;
  for (const c of list) circle(svg, x0 + c.x, yb + c.y, DOT.r, { fill });
  return { w: list.width, mid: y + DOT.rows * DOT.px / 2 };
}
// The article's grid at a deck stroke of 2 px. A fired check is lavender with a
// blue dot on every page; a fired flip check keeps a light tint of its kind, as
// in the article, so the kind still reads (p8, p11 depend on it).
function deckGrid(svg, o) {
  const G = S.grid(svg, { C, helper: 0, ...o });
  G.root.querySelectorAll('circle').forEach((e) => { if (e.getAttribute('stroke') === C.ink) e.setAttribute('stroke-width', 2); });
  for (const t of Object.values(G.tiles)) {
    const set = t.setFired.bind(t);
    t.setFired = (p) => { set(p); if (p > 0.001) t.base.setAttribute('fill-opacity', '0'); };
  }
  return G;
}
// The heap drawing: talk-heap round 2, candidate 1 (26 November).
function heap(svg) {
  F.h('image', { href: 'heap.png', x: 20, y: 30, width: 1800, height: 1012 }, svg);
  // the fridge hangs: two rods up to a ceiling line, in the drawing's own pen
  path(svg, 'M120 404 C220 401 360 407 480 403 M205 404 L203 456 M395 404 L397 456', { stroke: '#2E2C27', 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round' });
}

// The footer carries the source and, once, the field's own word for the page.
function slide(id, title, n, foot, term) {
  const el = document.getElementById(id);
  const svg = F.h('svg', { viewBox: '0 0 1920 1080', width: 1920, height: 1080 });
  el.appendChild(svg);
  if (title) T(svg, 80, 136, title, { size: 64, weight: TW, family: 'serif' });
  if (n) {
    line(svg, 80, 1000, 1840, 1000, { stroke: C.hairline, 'stroke-width': 1.5 });
    T(svg, 80, 1040, foot || '', { family: 'mono', size: 20, fill: C.muted });
    T(svg, 1840, 1040, typeof n === 'string' ? 'backup ' + n : n + ' / 18', { family: 'mono', size: 20, fill: C.muted, anchor: 'end' });
  }
  return svg;
}
const CAP = { size: 28, family: 'sans', fill: C.muted }; // chart labels: set type, not code; 28 px is the floor
const CAP_C = { ...CAP, anchor: 'middle' };
const PENCIL = { stroke: '#2E2C27', 'stroke-width': 2.6, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
const arrowHead = (svg, x, y, ang) => { const a = 16, w = 0.45; path(svg, `M${x - a * Math.cos(ang - w)} ${y - a * Math.sin(ang - w)}L${x} ${y}L${x - a * Math.cos(ang + w)} ${y - a * Math.sin(ang + w)}`, PENCIL); };

// ---------------- p1: title, the heap (layout A)
{
  const svg = slide('p1');
  heap(svg);
  T(svg, 80, 190, 'The other half of a quantum computer', { size: 88, weight: TW, family: 'serif' });
  T(svg, 82, 262, 'Quantum Computing seminar · TH Deggendorf · 9 January 2027', { size: 32, family: 'sans', fill: C.muted });
}

// ---------------- p2: the headline, and what was underneath (layout C)
{
  const svg = slide('p2', 'Willow’s real news wasn’t the speed.', 2,
    'speed: Google blog, 9 Dec 2024 · errors: Nature 638 (2025), Table S1');
  T(svg, 80, 250, 'Each bigger grid halved the errors.', { size: 44, family: 'sans' });
  const rows = [['smallest grid', 17, 712, 380, C.muted], ['middle grid', 49, 349, 570, C.muted], ['largest grid', 97, 171, 760, C.ink]];
  const nx = 1360;
  rows.forEach(([g, q, nn, y, fill], i) => {
    const { mid } = stack(svg, 80, y, nn, fill);
    T(svg, nx, mid + 16, String(nn), { family: 'mono', size: 48, weight: 500, fill, anchor: 'end' });
    T(svg, nx + 30, mid + 12, `${g}, ${q} qubits`, CAP);
  });
  T(svg, nx + 30, 400, 'errors per 100,000 rounds', CAP);
  [555, 745].forEach((y) => T(svg, nx, y + 12, '÷ 2', { family: 'mono', size: 32, fill: C.muted, anchor: 'end' }));
}

// ---------------- M1: the map of the machine (layout C)
{
  const svg = slide('m1', 'A quantum computer is two machines.', 3, '');
  const cy = 560;
  // the chip: qubits and checks
  const G = deckGrid(svg, { checks: lat.checks, d: 3, cx: 300, cy, pitch: 84, qr: 14 });
  for (const id of lat.walk[0].fired) G.tiles[id].setFired(1);
  T(svg, 300, 760, 'the chip', { size: 34, family: 'sans', anchor: 'middle' });
  T(svg, 300, 802, 'qubits, and checks between them', CAP_C);
  // the hints: one frame per round
  const fx = 560, fw = 64, fy = cy - 46;
  for (let i = 0; i < 7; i++) {
    const x = fx + i * (fw + 8);
    rect(svg, x, fy, fw, 92, { fill: 'none', stroke: C.ink, 'stroke-width': 1.6 });
    const k = (i * 37) % 5;
    circle(svg, x + 18 + (k % 3) * 14, fy + 30 + (k % 2) * 30, 6, { fill: C.accent });
  }
  path(svg, `M${fx + 7 * (fw + 8) + 10} ${cy}H${1190}`, { stroke: C.ink, 'stroke-width': 2.5 });
  path(svg, `M1176 ${cy - 10}L1192 ${cy}L1176 ${cy + 10}`, { stroke: C.ink, 'stroke-width': 2.5, fill: 'none' });
  T(svg, fx + 3.5 * (fw + 8), 760, 'the hints', { size: 34, family: 'sans', anchor: 'middle' });
  T(svg, fx + 3.5 * (fw + 8), 802, 'one frame every round', CAP_C);
  // the decoder: an ordinary computer
  rect(svg, 1210, cy - 90, 300, 180, { rx: 10, fill: 'none', stroke: C.ink, 'stroke-width': 2.5 });
  T(svg, 1360, cy + 12, 'decoder', { size: 34, family: 'sans', anchor: 'middle' });
  T(svg, 1360, 760, 'an ordinary computer', { size: 34, family: 'sans', anchor: 'middle' });
  T(svg, 1360, 802, 'reads the hints, decides what went wrong', CAP_C);
  path(svg, `M1520 ${cy}H1660`, { stroke: C.ink, 'stroke-width': 2.5 });
  path(svg, `M1646 ${cy - 10}L1662 ${cy}L1646 ${cy + 10}`, { stroke: C.ink, 'stroke-width': 2.5, fill: 'none' });
  T(svg, 1680, cy + 12, 'the fix', { size: 34, hand: true });
  T(svg, 80, 214, 'This talk is about the second one.', { size: 32, family: 'sans', fill: C.muted });
}

// ---------------- p3: 171 against 143 (layout C)
{
  const svg = slide('p3', 'Same recordings, a second reader', 4,
    'Nature 638 (2025) · network: Bausch et al., Nature 635 (2024)');
  T(svg, 80, 214, 'Willow’s largest grid, errors per 100,000 rounds. Lower is better.', { size: 32, family: 'sans', fill: C.muted });
  const col = (x, nn, fill, a, b, ring) => {
    T(svg, x, 590, String(nn), { family: 'mono', size: 180, weight: 500, fill });
    T(svg, x, 700, a, { size: 34, family: 'sans' });
    T(svg, x, 746, b, { size: 28, family: 'sans', fill: C.muted });
    if (ring) penRing(svg, x + 166, 528, 210, 112, { stroke: C.ink, width: PEN, seed: 11, start: 0.6 });
  };
  col(120, 171, C.muted, 'matching, Google’s standard decoder', 'rule-based, no learning', false);
  col(1000, 143, C.ink, 'a neural network decoder', 'trained, AlphaQubit’s design', true);
}

// ---------------- p4: a few slips in a thousand (layout C)
{
  const svg = slide('p4', 'Even good hardware slips a few times in a thousand.', 5,
    'Nature 638 (2025), Table S4, 72-qubit chip · Gidney and Ekerå (2021)');
  T(svg, 80, 214, 'On Google’s 72-qubit chip: a gate about 3 in 1,000, a readout about 8.', { size: 32, family: 'sans', fill: C.muted });
  const hit = new Set([132, 318, 457, 706, 881]);
  const px = 17.4, x0 = 80, y0 = 270;
  for (let i = 0; i < 1000; i++) {
    const x = x0 + (i % 100) * px + px / 2, y = y0 + Math.floor(i / 100) * px + px / 2;
    const on = hit.has(i);
    circle(svg, x, y, on ? 8.5 : 5, { fill: on ? C.ink : '#959BA5' });
  }
  T(svg, 80, 500, '1,000 operations, 5 slips', CAP);
  { const i = 457, x = x0 + (i % 100) * px + px / 2, y = y0 + Math.floor(i / 100) * px + px / 2;
    path(svg, `M${x + 120} ${y + 150} Q${x + 60} ${y + 120} ${x + 14} ${y + 16}`, PENCIL); arrowHead(svg, x + 14, y + 16, Math.atan2(-104, -46));
    T(svg, x + 130, y + 168, 'one slip', { size: 34, hand: true }); }
  T(svg, 80, 680, 'Breaking today’s encryption takes billions of steps.', { size: 44, family: 'sans' });
  T(svg, 80, 750, 'At 1 slip in 1,000, that is millions of slips.', { size: 44, family: 'sans' });
}

// ---------------- p5: same, or different (layout C)
{
  const svg = slide('p5', 'Measuring a qubit destroys its superposition.', 6, '');
  const my = 430;
  circle(svg, 210, my, 66, { fill: C.paper, stroke: C.ink, 'stroke-width': 2 });
  T(svg, 210, my - 4, '0 and', { size: 26, family: 'sans', anchor: 'middle' });
  T(svg, 210, my + 26, '1', { size: 26, family: 'sans', anchor: 'middle' });
  T(svg, 350, my - 22, 'measure', CAP_C);
  T(svg, 350, my + 20, '→', { size: 44, family: 'sans', fill: C.muted, anchor: 'middle' });
  circle(svg, 490, my, 66, { fill: C.paper, stroke: C.ink, 'stroke-width': 2 });
  T(svg, 490, my + 16, '1', { size: 44, family: 'mono', weight: 500, anchor: 'middle' });
  T(svg, 80, 600, 'Measure it: the mix is gone.', { size: 34, family: 'sans' });
  const cy = my, pitch = 260, R = 44, xa0 = 900;
  [[0, 'same', false], [1, 'different', true]].forEach(([i, word, fired]) => {
    const xa = xa0 + i * pitch;
    rect(svg, xa, cy - 70, pitch, 140, { fill: fired ? C.field : 'none', stroke: fired ? C.accent : C.muted, 'stroke-width': 1.5 });
    if (fired) circle(svg, xa + pitch / 2, cy - 34, 10, { fill: C.accent });
    T(svg, xa + pitch / 2, cy + (fired ? 30 : 10), word, { size: 32, family: 'sans', anchor: 'middle' });
  });
  for (let i = 0; i < 3; i++) circle(svg, xa0 + i * pitch, cy, R, i === 2 ? { fill: C.ink } : { fill: C.paper, stroke: C.ink, 'stroke-width': 2 });
  T(svg, xa0 + 2 * pitch + 60, cy - 70, 'flipped', { size: 30, hand: true });
  T(svg, 900, 600, 'So the chip only asks: same, or different?', { size: 34, family: 'sans' });
}

// ---------------- p6: flip and phase error (layout B)
{
  const svg = slide('p6', 'Two ways to go wrong: a flip, and a phase error.', 7, '');
  T(svg, 80, 440, 'A qubit’s state: some 0,', { size: 34, family: 'sans' });
  T(svg, 80, 488, 'some 1, and a sign', { size: 34, family: 'sans' });
  T(svg, 80, 536, 'between them.', { size: 34, family: 'sans' });
  const tile = (x, y, shaded) => {
    rect(svg, x, y, 64, 64, shaded ? { fill: C.ink, 'fill-opacity': 0.075, stroke: C.muted, 'stroke-width': 1.4 } : { fill: 'none', stroke: C.muted, 'stroke-width': 2 });
    for (const [dx, dy] of [[0, 0], [64, 0], [0, 64], [64, 64]]) circle(svg, x + dx, y + dy, 9, { fill: C.paper, stroke: C.ink, 'stroke-width': 1.8 });
  };
  const F2 = { family: 'serif', size: 60, italic: true, fill: C.ink };
  const rowT = (y, letter, name, before, after, shaded, seen) => {
    S.errMark(svg, 900, y - 14, 30, letter, C, 'real');
    T(svg, 950, y - 2, name, { size: 34, family: 'sans' });
    T(svg, 870, y + 96, before, F2);
    T(svg, 1250, y + 94, '→', { family: 'sans', size: 52, fill: C.muted });
    T(svg, 1350, y + 96, after, F2);
    tile(1650, y + 40, shaded);
    T(svg, 1682, y + 160, seen, { ...CAP_C, size: 26 });
  };
  rowT(290, 'X', 'a flip: 0 and 1 swap', 'a·0 + b·1', 'a·1 + b·0', true, 'flip checks');
  rowT(620, 'Z', 'a phase error: the sign reverses', 'a·0 + b·1', 'a·0 − b·1', false, 'phase checks');
}

// ---------------- p7: the threshold (layout B)
{
  const svg = slide('p7', 'A bigger grid helps only if each qubit is good enough.', 8,
    'Nature 638 (2025) · threshold: Fowler et al. 2012');
  T(svg, 80, 300, 'Below about 1 slip in 100,', { size: 34, family: 'sans' });
  T(svg, 80, 348, 'bigger grids make fewer errors.', { size: 34, family: 'sans' });
  T(svg, 80, 480, 'Above it, they make more.', { size: 34, family: 'sans' });
  T(svg, 80, 528, 'For years, chips were above it.', { size: 32, family: 'sans', fill: C.muted });
  const pitch = 44, base = 680;
  [[3, 17, 820], [5, 49, 1160], [7, 97, 1610]].forEach(([d, q, cx]) => {
    const half = (d - 1) / 2 * pitch;
    deckGrid(svg, { checks: S.surface(d), d, cx, cy: base - half - 24, pitch, qr: 9 });
    T(svg, cx, base + 44, `distance ${d}, ${q} qubits`, CAP_C);
  });
  for (const [xa, xb] of [[840, 1140], [1185, 1600]]) {
    const xm = (xa + xb) / 2;
    path(svg, `M${xa} 752 Q${xm} 812 ${xb} 754`, PENCIL); arrowHead(svg, xb, 754, Math.atan2(754 - 812, xb - xm));
    T(svg, xm, 842, 'errors ÷ 2', { size: 36, hand: true, anchor: 'middle' });
  }
  T(svg, 80, 650, 'Willow is below it.', { size: 34, family: 'sans' });
}

// ---------------- p8: only a change (layout B)
{
  const svg = slide('p8', 'The checks never see the qubits, only a change.', 9, '');
  T(svg, 80, 300, 'One flip: the two flip', { size: 34, family: 'sans' });
  T(svg, 80, 348, 'checks beside it fire.', { size: 34, family: 'sans' });
  T(svg, 80, 520, 'one check, round by round', CAP);
  ['round 1', 'round 2', 'round 3'].forEach((r, i) => {
    const x = 80 + i * 160, fired = i === 1;
    rect(svg, x, 548, 110, 110, fired ? { fill: C.field, stroke: C.accent, 'stroke-width': 1.5 } : { fill: 'none', stroke: C.muted, 'stroke-width': 1.5 });
    if (fired) circle(svg, x + 55, 603, 11, { fill: C.accent });
    T(svg, x + 55, 698, ['even', 'odd', 'odd'][i], { size: 32, family: 'sans', anchor: 'middle' });
    T(svg, x + 55, 736, r, CAP_C);
  });
  T(svg, 80, 840, 'It fires only when its answer changes.', { size: 34, family: 'sans' });
  const G = deckGrid(svg, { checks: lat.checks, d: 3, cx: 1360, cy: 560, pitch: 210, qr: 30 });
  for (const id of lat.walk[0].fired) G.tiles[id].setFired(1);
  for (const [q, letter] of Object.entries(lat.walk[0].errors)) { const [x, y] = G.pos(+q); S.errMark(svg, x, y, 32, letter, C, 'real'); }
}

// ---------------- p9: one frame of hints (layout A: the drawing bleeds, so no footer rule)
{
  const svg = slide('p9');
  heap(svg);
  T(svg, 80, 136, 'Each round, the chip puts out one frame of hints.', { size: 64, weight: TW, family: 'serif' });
  T(svg, 80, 212, 'about 90,000 rounds in a tenth of a second', { size: 32, family: 'sans', fill: C.muted });
  T(svg, 1840, 1040, '10 / 18', { family: 'mono', size: 20, fill: C.muted, anchor: 'end' });
  const run = film.runs[0];
  const round = run.frames.findIndex((f, i) => i > 0 && f.length >= 5 && f.length <= 7 && new Set(f.map((id) => run.checks[id].kind)).size === 2);
  const pitch = 54, cx = 840, cy = 500, bh = 4.3 * pitch;
  rect(svg, cx - bh, cy - bh, 2 * bh, 2 * bh, { rx: 6, fill: C.paper, stroke: C.ink, 'stroke-width': 2 });
  const G = deckGrid(svg, { checks: S.surface(7), d: 7, cx, cy, pitch, qr: 11 });
  const on = run.frames[round].map((id) => toGrid(run.checks[id], 7));
  Object.values(G.tiles).forEach((t) => { if (on.some((c) => c.row === t.check.row && c.col === t.check.col && c.asks_about === t.check.asks_about)) t.setFired(1); });
  penRing(svg, 668, 966, 50, 36, { stroke: C.ink, width: PEN, seed: 17, start: 0.3 });
  path(svg, `M${cx - 40} ${cy + bh}Q${cx - 110} ${820} ${690} ${930}`, { stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round' });
  const lx = cx + bh + 30;
  T(svg, lx, cy - 40, 'one round, enlarged', { size: 34, hand: true });
  T(svg, lx, cy + 12, 'Fired: the checks whose answer changed.', { size: 32, family: 'sans', fill: C.muted });
}

// ---------------- p10: the silent line, before and after (layout C)
{
  const svg = slide('p10', 'The one mistake that matters sets off no check.', 11,
    'distance 5 · only the flip checks drawn');
  const pitch = 112, cy = 530;
  const panel = (cx, withFix) => {
    const G = deckGrid(svg, { checks: lineD.flip_checks, d: 5, cx, cy, pitch, qr: 22 });
    const real = lineD.real_errors;
    if (!withFix) for (const ch of lineD.flip_checks) if (ch.qubits.filter((q) => real.includes(q)).length % 2) G.tiles[ch.id].setFired(1);
    if (withFix) { const [tx] = G.pos(2); line(svg, tx, cy - 2 * pitch - 60, tx, cy + 2 * pitch + 60, { stroke: C.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }); }
    for (const q of real) { const [x, y] = G.pos(q); S.errMark(svg, x, y, 24, 'X', C, 'real'); }
    if (withFix) for (const q of lineD.decoder_correction) { const [x, y] = G.pos(q); S.errMark(svg, x, y, 24, 'X', C, 'added'); }
    if (withFix) { const [x, y] = G.pos(lineD.decoder_correction[1]); T(svg, x + 26, y + 66, 'added by the decoder', { size: 30, hand: true }); }
  };
  panel(560, false); panel(1340, true);
  T(svg, 200, 300, '1', { family: 'mono', size: 44, weight: 500 });
  T(svg, 980, 300, '2', { family: 'mono', size: 44, weight: 500 });
  T(svg, 80, 214, 'Flips lined up across the grid look like no error at all.', { size: 32, family: 'sans', fill: C.muted });
  T(svg, 560, 900, '3 real flips, black X: one check fires.', { size: 34, family: 'sans', anchor: 'middle' });
  T(svg, 1340, 900, `${lineD.decoder_correction.length} added, white X: no check fires.`, { size: 34, family: 'sans', anchor: 'middle' });
}

// ---------------- p11: matching's answer against the likelier one (layout C)
{
  const svg = slide('p11', 'Fewer errors, less likely', 12,
    'distance 3 · our own count');
  T(svg, 80, 214, 'Same fired checks, two explanations. Matching counts a Y as two errors, so it picks the left.', { size: 32, family: 'sans', fill: C.muted });
  const ex = lat.example, pitch = 150, cy = 500;
  const draw = (cx, errs) => {
    const G = deckGrid(svg, { checks: lat.checks, d: 3, cx, cy, pitch, qr: 24 });
    for (const id of ex.fired) G.tiles[id].setFired(1);
    for (const [q, letter] of Object.entries(errs || {})) { const [x, y] = G.pos(+q); S.errMark(svg, x, y, 30, letter, C, 'added'); }
    return G;
  };
  draw(560, ex.plain_matching.errors);
  const G2 = draw(1360, ex.read_together.errors);
  { const [x, y] = G2.pos(5); S.errMark(svg, x, y, 30, 'Z', C, 'added'); T(svg, x + 56, (y + G2.pos(8)[1]) / 2 + 14, 'or', { size: 44, hand: true }); }
