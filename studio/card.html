<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio: figure card</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="tell.css">
<style>
  body { margin: 0; padding: 16px; }
  .title { font: 600 1.05rem/1.35 var(--sans); max-width: 38em; margin: 0 0 10px; }
  .stage-box { position: relative; outline: 1px solid var(--hairline); background: var(--paper); }
  .stage-box svg { position: absolute; inset: 0; margin: auto; }
  .meta { font: 12px var(--mono); color: var(--muted); margin: 6px 0 22px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
  .steps figure { margin: 0; }
  .steps .box { position: relative; outline: 1px solid var(--hairline); aspect-ratio: var(--ar); }
  .steps .box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .steps figcaption { font: 13px/1.4 var(--sans); color: var(--muted); margin-top: 4px; }
  .steps figcaption b { font: 500 12px var(--mono); color: var(--ink); margin-right: 6px; }
  h2 { font: 600 0.95rem var(--sans); margin: 0 0 8px; }
</style>
</head>
<body>
<!-- card.html?fig=id : the figure alone, as a reader who has read nothing meets it
     (its alone frame, at the size its stage has on this screen), then every step. -->
<p class="title" id="title"></p>
<div class="stage-box" id="stage"></div>
<p class="meta" id="meta"></p>
<h2>Every step</h2>
<div class="steps" id="steps"></div>
<script type="module">
const TITLES = {
  'two-readers': 'One recording from a quantum chip, read by two programs: two different error counts',
  water: "A qubit's state starts to smear within a thousandth of a blink",
  grid: 'The chip never looks at its qubits. It asks questions, and the answers light up',
  'two-ways': 'The standard program misses the answer that can happen in two ways',
  ladder: "On Google's chip, each step to a bigger grid halved the errors",
  reels: 'Our small network passed the standard program one grid bigger only at the end of a run nearly four times longer, and still trailed the better free program',
  answered: 'What we can answer, and what is still open',
};
const q = new URLSearchParams(location.search);
const id = q.get('fig');
const mod = (await import(`./figures/${id}.js`)).default;
const layoutOf = (w, h) => (w / h < 1.05 ? 'tall' : w / h < 1.45 ? 'mid' : 'wide');
// the stage this screen would give the figure (as in tell.js)
const W = innerWidth - 32, H = innerHeight;
const beside = innerWidth >= 1000 && H >= 560 && innerWidth > H;
const sw = beside ? Math.min(860, W - 28 * 17 - 64) : W;
const sh = beside ? Math.min(0.8 * H, 860) : (innerWidth < 700 ? 0.44 : 0.40) * H;
const box = document.getElementById('stage');
box.style.width = sw + 'px'; box.style.height = sh + 'px';
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
box.appendChild(svg);
const ctx = { layout: layoutOf(sw, sh), k: 1, reduced: true };
const api = mod.mount(svg, ctx);
const vb = svg.viewBox.baseVal, s = Math.min(sw / vb.width, sh / vb.height, 1.3);
Object.assign(svg.style, { width: vb.width * s + 'px', height: vb.height * s + 'px' });
api.render(api.alone);
document.getElementById('title').textContent = TITLES[id] || id;
document.getElementById('meta').textContent = `${id} · alone frame (step ${api.alone}) · stage ${Math.round(sw)} × ${Math.round(sh)} px · ${ctx.layout} design`;
const steps = document.getElementById('steps');
const n = mod.steps.length;
for (let k = 1; k <= n; k++) {
  const held = mod.steps[k - 1].held;
  const positions = held ? Array.from({ length: held }, (_, f) => k - 1 + (f + 1) / held) : [k];
  positions.forEach((pos, f) => {
    const fig = document.createElement('figure');
    const b = document.createElement('div'); b.className = 'box';
    const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); b.appendChild(sv);
    fig.appendChild(b);
    const a = mod.mount(sv, { layout: ctx.layout, k: 1, reduced: true });
    a.render(pos);
    b.style.setProperty('--ar', `${sv.viewBox.baseVal.width} / ${sv.viewBox.baseVal.height}`);
    const cap = document.createElement('figcaption');
    cap.innerHTML = `<b>${k}${held ? `·${f + 1}` : ''}</b>${a.desc ? a.desc(k) : ''}${held ? ' (held frame)' : ''}`;
    fig.appendChild(cap); steps.appendChild(fig);
  });
}
</script>
</body>
</html>
